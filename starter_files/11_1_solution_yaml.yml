trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '16.x'
  displayName: 'Install Node.js'

- script: |
    npm install @types/express # Correct spelling
  displayName: 'Install Dependencies'

- script: |
    npm run build
  displayName: 'Build the Application'